<style>
/* Layout: barra lateral escura fixa (navegação do sistema) + área de trabalho clara; no celular a navegação vira faixa de abas no topo */
:root {
  --bg: #f2f5f7; --surface: #ffffff; --ink: #142838; --muted: #637382; --line: #dfe6eb; --soft: #ebf1f4;

  --side: #1a3a51; --side-ink: #eef4f7; --side-muted: #93abbb;
  --ok: #1d8a5b; --ok-soft: #e3f3eb; --warn: #b8730c; --warn-soft: #fbf0dc; --bad: #c43d2c; --bad-soft: #fbe6e3;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1620; --surface: #12212d; --ink: #e8f0f4; --muted: #8fa3b2; --line: #1f3443; --soft: #172a38;
  --accent: #2fd1bd; --accent-soft: #0f302d;
  --side: #1a3a51; --side-ink: #eef4f7; --side-muted: #93abbb;
  --ok: #5cc794; --ok-soft: #13291f; --warn: #e5ad52; --warn-soft: #2d2412; --bad: #f08573; --bad-soft: #321a16;
  --s-todo: #1f4a46; --s-doing: #2a9d8f; --s-done: #6fe3d3;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1620; --surface: #12212d; --ink: #e8f0f4; --muted: #8fa3b2; --line: #1f3443; --soft: #172a38;
  --accent: #2fd1bd; --accent-soft: #0f302d;
  --side: #1a3a51; --side-ink: #eef4f7; --side-muted: #93abbb;
  --ok: #5cc794; --ok-soft: #13291f; --warn: #e5ad52; --warn-soft: #2d2412; --bad: #f08573; --bad-soft: #321a16;

  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100%; }

.brand img { display: block; width: 150px; height: auto; margin-left: -8px; }
.brand small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--side-muted); margin-top: 2px; }
.brand::after { content: ""; display: block; height: 2px; width: 44px; margin-top: 12px; border-radius: 2px; background: linear-gradient(90deg, var(--teal-a), var(--teal-b)); }
nav.menu { display: grid; gap: 2px; }
.menu .group { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--side-muted); margin: 14px 10px 6px; }
.menu button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: transparent; border: 0; color: var(--side-ink); padding: 8px 10px; border-radius: 8px; font-weight: 500; opacity: 0.78; }
.menu button:hover { opacity: 1; background: rgba(255,255,255,0.05); }

.menu .badge { font-family: var(--mono); font-size: 11px; color: var(--side-muted); }
.menu .lock { font-size: 11px; color: var(--side-muted); }
.side .foot { margin-top: auto; font-size: 12px; color: var(--side-muted); }

main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); display: grid; gap: 22px; align-content: start; }
.crumb { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 20px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel.dark { background: var(--side); color: var(--side-ink); border-color: var(--side); box-shadow: inset 0 3px 0 var(--teal-a); }
.panel.dark .btn { background: transparent; color: var(--side-ink); border-color: rgba(255,255,255,0.25); }
.panel.dark .k, .panel.dark .muted { color: var(--side-muted); }
.panel .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.muted { color: var(--muted); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; }
.flow .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

.big { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }

.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 10px; border: 0; background: transparent; text-align: left; width: 100%; }
button.row:hover { background: var(--soft); }
.row .t { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.row .s { font-size: 12px; color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 13px; padding: 8px; }
.pill { font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; text-align: left; width: 100%; }
.card:hover { border-color: var(--muted); }

.cal .day.out { background: var(--soft); }
.cal .day .dn { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal .day.today .dn b { background: var(--accent); color: var(--surface); border-radius: 99px; padding: 0 7px; }
.cal .day .add { border: 0; background: transparent; color: var(--muted); opacity: 0; font-size: 15px; line-height: 1; padding: 0 4px; }
.cal .day:hover .add, .cal .day .add:focus-visible { opacity: 1; }
.cal .ev { display: grid; gap: 1px; border: 0; text-align: left; border-left: 3px solid var(--c); background: var(--soft); border-radius: 6px; padding: 4px 6px; font-size: 12px; width: 100%; }
.cal .ev .et { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .ev .es { font-size: 10.5px; color: var(--muted); }

.clients { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.client { text-align: left; border-top: 4px solid var(--c); }

a.btn.primary { color: #ffffff; }
.client .name { font-family: var(--display); font-size: 26px; line-height: 1.05; }

.table-wrap { overflow-x: auto; }

td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
.in { color: var(--ok); } .out { color: var(--bad); }

dialog.drawer { border: 0; padding: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(480px, 100%); background: var(--surface); color: var(--ink); box-shadow: -20px 0 60px rgba(0,0,0,0.18); }
dialog.drawer::backdrop { background: rgba(10,12,16,0.35); }
.drawer form { display: grid; gap: 14px; padding-block: max(22px, env(safe-area-inset-top, 0px)) 22px; padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.drawer .dhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.drawer h3 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; }
.field textarea { min-height: 96px; resize: vertical; }
.field.check { grid-template-columns: auto 1fr; align-items: center; }
.field.check input { width: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dfoot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding-top: 6px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.kpi .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--bad); }
.prose { white-space: pre-line; max-width: 70ch; overflow-wrap: anywhere; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { display: grid; gap: 4px; border: 0; background: transparent; padding: 0; text-align: left; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sw i { display: block; width: 64px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--c); }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.imgs figure { margin: 0; position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--soft); aspect-ratio: 1; max-width: 100%; }
.imgs img { width: 100%; height: 100%; object-fit: contain; display: block; }
.imgs a.file { display: grid; place-items: center; height: 100%; padding: 10px; text-align: center; font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
.imgs .rm { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 99px; padding: 2px 8px; font-size: 11px; background: var(--surface); color: var(--bad); opacity: 0; }
.imgs figure:hover .rm, .imgs .rm:focus-visible, .imgs .rm.sure { opacity: 1; }
label.btn { display: inline-flex; align-items: center; position: relative; }
label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.links a { color: var(--accent); overflow-wrap: anywhere; }
.prog { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.prog i { display: block; height: 100%; width: var(--p, 0%); background: linear-gradient(90deg, var(--teal-a), var(--teal-b)); border-radius: 99px; }
.pillars { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pillar { display: grid; gap: 8px; align-content: start; }
.pillar .pn { font-family: var(--display); font-size: 40px; line-height: 0.9; color: var(--accent); }
.pillar h3 { margin: 0; font-size: 15px; }
.pillar p { margin: 0; font-size: 13px; color: var(--muted); }
.phase { display: grid; gap: 10px; }
.phase .ph h2 { display: flex; gap: 10px; align-items: baseline; }
.phase .ph h2 .pn { font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--accent); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.checks label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; cursor: pointer; }
.checks label:hover { background: var(--soft); }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks .done span.lbl { color: var(--muted); text-decoration: line-through; }
.checks .role { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.prio { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; background: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.donuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.donut { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 14px; background: var(--soft); text-align: left; border: 0; width: 100%; }
.donut svg { width: 104px; height: 104px; display: block; }
.donut svg circle.seg { transition: stroke-width .15s; }
.donut svg circle.seg:hover { stroke-width: 16; }
.donut .dn { font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.donut dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.mx { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mxq { border-top: 4px solid var(--qc); }
.mxq .qk { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--qc); }
.mxq h2 { font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--qc); }
.mq1 { --qc: #8a3fb0; } .mq2 { --qc: var(--accent); } .mq3 { --qc: var(--warn); } .mq4 { --qc: var(--bad); }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px; border-radius: 10px; }
.task:hover { background: var(--soft); }

form.quick { display: flex; flex-wrap: wrap; gap: 8px; }
form.quick input[type=text] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; }

@media (max-width: 760px) { .mx { grid-template-columns: 1fr; } }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; max-width: 75ch; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside.side { position: static; height: auto; padding-block: 14px 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
  .side .foot, .menu .group { display: none; }
  nav.menu { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }

}

</style>

  async function save(col, id, data) {
    try { if (id) await db.collection(col).doc(id).set(data); else await db.collection(col).add(data); return true; }
    catch (e) { setErr("Não consegui salvar. Confira a conexão e tente de novo."); return false; }
  }
  async function patch(col, id, data) {
    try { await db.collection(col).doc(id).update(data); } catch (e) { setErr("Não consegui salvar a mudança. Tente de novo."); }
  }
  async function del(col, id) {
    try { await db.collection(col).doc(id).delete(); } catch (e) { setErr("Não consegui apagar. Tente de novo."); }
  }
  function listen(col, key, sortFn) {
    db.collection(col).onSnapshot((snap) => {
      S[key] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      if (sortFn) S[key].sort(sortFn);
      S.ready = true; render();
    }, (e) => setErr(e.code === "revoked" ? "Seu acesso a esta central foi encerrado." : "Perdi a conexão com os dados. Recarregue a página."));
  }

  function listenMap(col, key) {
    db.collection(col).onSnapshot((snap) => {
      S[key] = {}; for (const d of snap.docs) S[key][d.id] = d.data();
      render();
    }, () => {});
  }

  // ---------- drawer ----------
  function openDrawer(title, fields, values, onSave, onDelete) {
    const f = $("#dform");
    S.confirmDel = false;
    const fieldHtml = (fd) => {
      const v = values[fd.id];
      const id = "f-" + fd.id;
      if (fd.type === "row") return '<div class="two">' + fd.fields.map(fieldHtml).join("") + "</div>";
      if (fd.type === "check") return '<div class="field check"><input type="checkbox" id="' + id + '"' + (v ? " checked" : "") + '><label for="' + id + '">' + esc(fd.label) + "</label></div>";
      let input;
      if (fd.type === "select") input = '<select id="' + id + '">' + fd.options.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(ov) + '"' + (String(v) === String(ov) ? " selected" : "") + ">" + esc(ol) + "</option>"; }).join("") + "</select>";
      else if (fd.type === "textarea") input = '<textarea id="' + id + '" placeholder="' + esc(fd.ph || "") + '">' + esc(v) + "</textarea>";
      else input = '<input id="' + id + '" type="' + (fd.type || "text") + '"' + (fd.type === "number" ? ' step="0.01" inputmode="decimal"' : "") + ' value="' + esc(v) + '" placeholder="' + esc(fd.ph || "") + '"' + (fd.required ? " required" : "") + ">";
      return '<div class="field"><label for="' + id + '">' + esc(fd.label) + "</label>" + input + "</div>";
    };
    f.innerHTML = '<div class="dhead"><h3>' + esc(title) + '</h3><button type="button" class="btn ghost" id="d-close">Fechar</button></div>' +
      fields.map(fieldHtml).join("") +
      '<div class="dfoot"><div>' + (onDelete ? '<button type="button" class="btn danger" id="d-del">Apagar</button>' : "") + '</div><button type="submit" class="btn primary">Salvar</button></div>';
    const flat = fields.flatMap((fd) => fd.type === "row" ? fd.fields : [fd]);
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const out = {};
      for (const fd of flat) {
        const el = $("#f-" + fd.id);
        if (fd.type === "check") out[fd.id] = el.checked;
        else if (fd.type === "number") out[fd.id] = el.value === "" ? null : Number(el.value);
        else out[fd.id] = el.value.trim();
      }
      if (await onSave(out) !== false) $("#drawer").close();
    };
    $("#d-close").onclick = () => $("#drawer").close();
    if (onDelete) $("#d-del").onclick = async (ev) => {
      if (!S.confirmDel) { S.confirmDel = true; ev.target.textContent = "Clique de novo para apagar"; return; }
      await onDelete(); $("#drawer").close();
    };
    $("#drawer").showModal();
  }

  async function uploadFiles(cid, field, files) {
    if (!assets) { setErr("Só quem é editor da central consegue enviar arquivos."); return; }
    S.uploading = true; render();
    const list = ((S.brand[cid] || {})[field] || []).slice();
    for (const f of files) {
      try { const r = await assets.upload(f); list.push({ id: r.id, url: r.url, name: f.name, type: r.contentType || f.type }); }
      catch (e) { S.err = "Não consegui enviar " + f.name + ". Imagens e PDFs de até 20 MB funcionam."; }
    }
    S.uploading = false;
    await save("brand", cid, Object.assign({}, S.brand[cid] || {}, { [field]: list }));
    render();
  }

  async function removeFile(cid, field, idx) {
    const b = S.brand[cid] || {}; const list = (b[field] || []).slice(); const item = list[idx];

    list.splice(idx, 1);
    await save("brand", cid, Object.assign({}, b, { [field]: list }));

  function vGeral() {

    const hi = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";

      (appr.length ? appr.length + " esperando aprovação do cliente." : "") + (late.length ? " " + late.length + " conteúdo" + (late.length > 1 ? "s" : "") + " atrasado" + (late.length > 1 ? "s" : "") + "." : "") + '</p></div>' +
      '<div class="toolbar"><button type="button" class="btn primary" data-new="dem">Nova demanda</button><button type="button" class="btn" data-new="post">Novo conteúdo</button><button type="button" class="btn" data-new="traffic">Demanda de tráfego</button></div></div>' +

  // Fluxo de demandas do mês: pedidas no mês, situação atual das abertas e concluídas no mês
  function demFlow() {
    const m = thisMonth();
    const asked = S.demandas.filter((d) => monthOf(d.created) === m).length;
    const cnt = (s) => S.demandas.filter((d) => d.status === s).length;
    const done = S.demandas.filter((d) => d.status === "feito" && monthOf(d.doneAt) === m).length;
    const cells = [["Pedidas no mês", asked], ["A fazer", cnt("afazer")], ["Em produção", cnt("fazendo")], ["Com o cliente", cnt("aprovacao")], ["Concluídas no mês", done]];
    return '<section class="panel c12"><div class="ph"><h2>Fluxo de demandas de ' + esc(MES[new Date().getMonth()]) + '</h2><button type="button" class="btn ghost" data-go="demandas">Abrir demandas</button></div><div class="flow">' +
      cells.map(([l, n]) => '<div><div class="n">' + n + '</div><div class="l">' + esc(l) + "</div></div>").join("") + "</div></section>";
  }

  // Progresso por cliente: conteúdos do mês + demandas abertas ou concluídas no mês
  function clientProgress(cid) {
    const m = thisMonth(); const r = { todo: 0, doing: 0, done: 0 };
    for (const p of S.posts) if (p.clientId === cid && monthOf(p.date) === m) r[p.status === "pauta" || !p.status ? "todo" : ["aprovado", "agendado", "publicado"].includes(p.status) ? "done" : "doing"]++;
    for (const d of S.demandas) if (d.clientId === cid && (d.status !== "feito" || monthOf(d.doneAt) === m)) r[d.status === "feito" ? "done" : d.status === "afazer" ? "todo" : "doing"]++;
    return r;
  }
  function donutSvg(r, name) {
    const total = r.todo + r.doing + r.done, R = 40, C = 2 * Math.PI * R, gap = total > 1 ? 2 : 0;
    const segs = [["done", "Feito", "var(--s-done)"], ["doing", "Em andamento", "var(--s-doing)"], ["todo", "Pedido, a fazer", "var(--s-todo)"]].filter(([k]) => r[k] > 0);
    let off = 0;
    const arcs = segs.map(([k, l, col]) => {
      const len = (r[k] / total) * C; const vis = Math.max(len - (segs.length > 1 ? gap : 0), 0.5);
      const s = '<circle class="seg" cx="52" cy="52" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="14" stroke-dasharray="' + vis.toFixed(2) + " " + (C - vis).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 52 52)"><title>' + esc(name) + " · " + l + ": " + r[k] + " de " + total + "</title></circle>";
      off += len; return s;
    }).join("");
    const pctDone = total ? Math.round((r.done / total) * 100) : 0;
    return '<svg viewBox="0 0 104 104" role="img" aria-label="' + esc(name) + ": " + r.done + " feitos, " + r.doing + " em andamento, " + r.todo + ' a fazer">' +
      '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="14"></circle>' + arcs +
      '<text x="52" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="Manrope, system-ui, sans-serif">' + (total ? pctDone + "%" : "—") + "</text>" +
      '<text x="52" y="66" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Manrope, system-ui, sans-serif">' + (total ? "feito" : "sem itens") + "</text></svg>";
  }
  function progressPanel() {
    const cards = S.clients.map((c) => {
      const r = clientProgress(c.id), total = r.todo + r.doing + r.done;
      return '<button type="button" class="donut" data-pcgo="' + c.id + '" style="--c:' + esc(c.color) + '">' + donutSvg(r, c.name) +
        '<div style="min-width:0"><div class="dn"><span class="dot"></span>' + esc(c.name) + "</div><dl><dt>Pedido no mês</dt><dd>" + total + "</dd><dt>Feito</dt><dd>" + r.done + "</dd><dt>Em andamento</dt><dd>" + r.doing + "</dd><dt>A fazer</dt><dd>" + r.todo + "</dd></dl></div></button>";
    }).join("");
    return '<section class="panel c12"><div class="ph"><h2>Progresso por cliente · ' + esc(MES[new Date().getMonth()]) + '</h2><div class="legend"><span><i style="background:var(--s-done)"></i>Feito</span><span><i style="background:var(--s-doing)"></i>Em andamento</span><span><i style="background:var(--s-todo)"></i>A fazer</span></div></div>' +
      '<p class="muted" style="margin:0;font-size:12px">Soma os conteúdos planejados para o mês e as demandas abertas ou concluídas no mês. Clique no cliente para abrir o painel dele.</p>' +

        '<section class="panel"><div class="table-wrap"><table><thead><tr><th>Médico</th>' + ROUT.map((g) => "<th>" + esc(g.title) + "</th>").join("") + "</tr></thead><tbody>" +
        (ops.length ? ops.map((x) => '<tr class="click" data-med="' + x.id + '"><td><b>' + esc(x.name) + '</b><div class="muted" style="font-size:12px">' + esc(x.specialty || "") + "</div></td>" +
          ROUT.map((g) => { const p = rotPct(x, S.medMonth, g); return '<td style="min-width:140px"><div class="prog" style="--p:' + p + '%"><i></i></div><div class="muted" style="font-size:12px">' + p + "%</div></td>"; }).join("") + "</tr>").join("")

          : '<li><button type="button" class="row" data-med="' + x.id + '" style="grid-template-columns:1fr auto"><span class="t">' + esc(x.name) + " · " + esc(label) + '</span><span class="pill warn">decidir</span></button></li>').join("")

          active.map((x) => '<tr class="click" data-med="' + x.id + '"><td><b>' + esc(x.name) + "</b></td>" + PILLARS.map((p) => { const pr = (x.prio || {})[p.id]; return "<td>" + (pr ? '<span class="pill ' + ({ alta: "bad", media: "warn", baixa: "acc", fora: "" }[pr] || "") + '">' + esc({ alta: "Alta", media: "Média", baixa: "Baixa", fora: "Fora" }[pr] || pr) + "</span>" : '<span class="muted">—</span>') + "</td>"; }).join("") + "</tr>").join("") +
          "</tbody></table></div></section>" : "");

      '<div class="toolbar"><button type="button" class="btn primary" data-new="med">Novo médico</button></div></div>' +
      '<div class="seg" role="tablist">' + tabs.map(([k, l]) => '<button type="button" data-medtab="' + k + '" aria-pressed="' + (tab === k) + '">' + l + "</button>").join("") + "</div>" + body;
  }

  function vMedDetail(m) {
    const prio = m.prio || {};
    const mm = S.medMonth;
    const cl = curLane(m);
    const lanePanel = (lane) => {
      const its = laneItems(m, lane); const done = its.filter(([k]) => isDone(m, k)).length;
      const state = laneDone(m, lane) ? '<span class="pill ok">concluída</span>' : cl && cl.id === lane.id ? '<span class="pill acc">etapa atual</span>' : '<span class="k">' + done + "/" + its.length + "</span>";
      const decision = lane.id === "le" ? '<div class="field"><label for="grav-' + m.id + '">Gravação in loco?</label><select id="grav-' + m.id + '" data-grav="' + m.id + '"><option value="">Definir com o médico</option><option value="sim"' + (m.gravacao === "sim" ? " selected" : "") + '>Sim · videomaker grava com o médico</option><option value="nao"' + (m.gravacao === "nao" ? " selected" : "") + ">Não · o médico envia a 1ª leva</option></select></div>" : "";
      return '<section class="panel phase c6"><div class="ph"><h2>' + esc(lane.title) + "</h2>" + state + '</div><p class="muted" style="margin:0">' + esc(lane.sub) + '</p><div class="prog" style="--p:' + pct(done, its.length) + '%"><i></i></div>' + decision +
        '<ul class="checks">' + its.map(([k, l, r, t]) => checkRow(m, k, l, r, t)).join("") + "</ul></section>";
    };
    const rotPanel = (g) => '<section class="panel phase c4"><div class="ph"><h2>' + esc(g.title) + '</h2><span class="k">' + rotPct(m, mm, g) + '%</span></div><ul class="checks">' + g.items.map(([k, l, r, t]) => checkRow(m, rkey(mm, k), l, r, t)).join("") + "</ul></section>";
    const pillarPanel = (ph) => '<section class="panel phase c6"><div class="ph"><h2><span class="pn">' + ph.n + "</span>" + esc(ph.title) + '</h2><select class="prio" data-prio="' + ph.id + '" aria-label="Prioridade de ' + esc(ph.title) + '">' +
      [["", "Prioridade"], ["alta", "Alta"], ["media", "Média"], ["baixa", "Baixa"], ["fora", "Fora do escopo"]].map(([v, l]) => '<option value="' + v + '"' + ((prio[ph.id] || "") === v ? " selected" : "") + ">" + l + "</option>").join("") + '</select></div><p class="muted" style="margin:0">' + esc(ph.sub) + '</p><ul class="checks">' + ph.items.map(([k, l]) => checkRow(m, k, l, "Entrega", "")).join("") + "</ul></section>";
    let action = "";
    if (m.status === "prospeccao" || m.status === "proposta") action = '<button type="button" class="btn primary" data-medstatus="implantacao">Fechou contrato</button>';
    else if (m.status === "implantacao" && !cl) action = '<button type="button" class="btn primary" data-medstatus="operacao">Iniciar rotina mensal</button>';
    const inClients = !!client(m.id);
    const sections = [];
    if (m.status !== "prospeccao" && m.status !== "proposta" && m.status !== "perdido") {
      sections.push('<div class="c12 ph"><h2>Implantação</h2><span class="k">' + implPct(m) + "% concluída</span></div>" + IMPL.map(lanePanel).join(""));
      if (m.status === "operacao" || m.status === "pausado") sections.push('<div class="c12 ph"><h2>Rotina de ' + esc(monthLabel(mm)) + '</h2><div class="toolbar"><button type="button" class="btn" data-medm="-1" aria-label="Mês anterior">←</button><button type="button" class="btn" data-medm="1" aria-label="Próximo mês">→</button></div></div>' + ROUT.map(rotPanel).join(""));
      sections.push('<div class="c12 ph"><h2>Pilares do Método iMed</h2><span class="k">prioridade e entregas</span></div>' + PILLARS.map(pillarPanel).join(""));
    }
    return '<div class="head"><div><div class="crumb"><button type="button" class="btn ghost" data-med="">← Marketing médico</button></div><h1>' + esc(m.name) + '</h1><p class="lede">' + esc([m.specialty, m.city, m.package, medStName(m.status)].filter(Boolean).join(" · ")) + "</p></div>" +
      '<div class="toolbar">' + action + (m.drive ? '<a class="btn" href="' + esc(m.drive) + '" target="_blank" rel="noopener">Abrir Drive</a>' : "") +
      (m.status === "operacao" ? (inClients ? '<button type="button" class="btn" data-pcgo="' + m.id + '">Calendário e métricas</button>' : '<button type="button" class="btn" data-medclient="' + m.id + '">Criar calendário de conteúdo</button>') : "") +
      '<button type="button" class="btn" data-editmed="' + m.id + '">Editar</button></div></div>' +
      '<div class="grid"><section class="panel dark c4"><div class="k">' + (m.status === "implantacao" ? "Etapa atual" : "Fase") + '</div><div class="big" style="font-size:30px">' + esc(m.status === "implantacao" ? (cl ? cl.title : "Pronto para a rotina") : medStName(m.status)) + '</div><div class="muted">' + (m.nextStep ? "Próximo passo: " + esc(m.nextStep) : "") + "</div></section>" +
      '<section class="panel c8"><div class="k">Diagnóstico e observações</div>' + (m.notes ? '<div class="prose">' + esc(m.notes) + "</div>" : '<p class="empty">Registre aqui o diagnóstico da Reunião #00.</p>') + (m.contact ? '<div class="muted">Contato: ' + esc(m.contact) + "</div>" : "") + "</section>" +
      sections.join("") + "</div>";
  }
  // ---------- equipe e matriz ----------
  function medPendingFor(roles) {
    const rows = [];
    for (const x of S.medicos.filter((y) => y.status === "implantacao" || y.status === "operacao")) {
      if (x.status === "implantacao") {
        const c = curLane(x); if (!c) continue;
        for (const it of laneItems(x, c)) if (roles.includes(it[2]) && !isDone(x, it[0])) rows.push([x, it[0], it[1], c.title, it[3]]);
      } else {
        for (const g of ROUT) for (const it of g.items) if (roles.includes(it[2]) && !isDone(x, rkey(thisMonth(), it[0]))) rows.push([x, rkey(thisMonth(), it[0]), it[1], g.title, it[3]]);
      }
    }
    return rows;
  }

      { type: "row", fields: [{ id: "assignee", label: "Responsável", type: "select", options: TEAM.map((t) => t.name) }, { id: "status", label: "Situação", type: "select", options: DEM_ST }] },
      { type: "row", fields: [{ id: "requestedBy", label: "Quem pediu", ph: "Ex.: Naylla" }, { id: "due", label: "Prazo", type: "date" }] },

    return '<span class="pill ' + (diff < 0 ? "bad" : diff === 0 ? "warn" : "") + '">' + (diff < 0 ? "atrasada · " + dShort(due) : diff === 0 ? "hoje" : diff === 1 ? "amanhã" : dShort(due)) + "</span>";

      '<div class="grid"><section class="panel dark c4"><div class="k">' + esc(person.what) + '</div><div class="big">' + (openD.length + posts.length + med.length) + '</div><div class="muted">pendências abertas</div></section>' +
      '<section class="panel c8"><div class="ph"><h2>Demandas</h2><span class="k">' + openD.length + ' abertas</span></div><ul class="list">' + (openD.length ? openD.map(demRow).join("") : '<li class="empty">Nenhuma demanda aberta.</li>') + "</ul>" +

      '<section class="panel c6"><div class="ph"><h2>Conteúdos com ' + esc(person.name) + '</h2><span class="k">' + posts.length + '</span></div><ul class="list">' + (posts.length ? posts.map(postRow).join("") : '<li class="empty">Nenhum conteúdo sob responsabilidade.</li>') + "</ul></section>" +

        (items.length ? items.map((x) => '<li><button type="button" class="row" data-traffic="' + x.id + '"><span class="pill">' + esc(x.kind || "") + '</span><span class="t">' + esc(x.title) +
          '<div class="s">' + [x.store, x.due ? "prazo " + dShort(x.due) : "", x.budget ? "verba " + brl(x.budget) : "", (x.updates || "").split("\n").filter(Boolean).slice(-1)[0]].filter(Boolean).map(esc).join(" · ") + "</div></span>" + trStatusPill(x.status) + "</button></li>").join("") : '<li class="empty">Nenhuma demanda.</li>') +
        "</ul></section>";
    }).join("");
    return '<div class="head"><div><div class="crumb">Operação / Tráfego pago</div><h1>Tráfego <em>pago</em></h1><p class="lede">Demandas, campanhas e o que acompanhar em cada cliente.</p></div>' +
      '<div class="toolbar"><button type="button" class="btn primary" data-new="traffic">Nova demanda</button></div></div>' + filterBar() +
      (groups || '<p class="empty">Nenhuma demanda de tráfego registrada.</p>') +
      '<p class="note">Para atualizar os números, peça ao Claude: “atualiza o tráfego da Moto e Cia”. Ele puxa os dados das contas de anúncio pelo Supermetrics e registra aqui nas atualizações.</p>';

  function vFinanceiro() {
    if (!S.owner) return '<h1>Financeiro</h1><p class="lede">Esta área é só da dona da central.</p>';
    const m = S.finMonth;
    const items = S.fin.filter((e) => monthOf(e.date) === m).sort(byDate);
    const sum = (f) => items.filter(f).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const inP = sum((e) => e.kind === "receber" && e.status !== "pago"), inR = sum((e) => e.kind === "receber" && e.status === "pago");
    const outP = sum((e) => e.kind !== "receber" && e.status !== "pago"), outR = sum((e) => e.kind !== "receber" && e.status === "pago");
    const missing = S.finrec.filter((r) => !S.fin.some((e) => e.id === r.id + "_" + m)).length;
    return '<div class="head"><div><div class="crumb">Operação / Financeiro · só você</div><h1>Financeiro</h1><p class="lede">Recebimentos, pagamentos a parceiros, notas fiscais, gastos e investimentos.</p></div>' +
      '<div class="toolbar"><button type="button" class="btn" data-fin="-1" aria-label="Mês anterior">←</button><h2 style="text-transform:capitalize">' + esc(monthLabel(m)) + '</h2><button type="button" class="btn" data-fin="1" aria-label="Próximo mês">→</button><button type="button" class="btn primary" data-new="fin">Novo lançamento</button></div></div>' +
      '<div class="grid">' +
      '<section class="panel c4"><div class="k">A receber</div><div class="big in">' + brl(inP) + '</div><div class="muted">Já recebido: ' + brl(inR) + "</div></section>" +
      '<section class="panel c4"><div class="k">A pagar e gastos</div><div class="big out">' + brl(outP) + '</div><div class="muted">Já pago: ' + brl(outR) + "</div></section>" +
      '<section class="panel dark c4"><div class="k">Saldo previsto do mês</div><div class="big">' + brl(inP + inR - outP - outR) + '</div><div class="muted">Entradas menos saídas</div></section></div>' +
      (missing ? '<div class="toolbar"><span class="muted">' + missing + " lançamento" + (missing > 1 ? "s" : "") + " recorrente" + (missing > 1 ? "s" : "") + " ainda não gerado" + (missing > 1 ? "s" : "") + ' neste mês.</span><button type="button" class="btn" data-genrec="1">Gerar recorrentes</button></div>' : "") +
      '<section class="panel"><div class="table-wrap"><table><thead><tr><th>Venc.</th><th>Descrição</th><th>Tipo</th><th>Cliente / parceiro</th><th>NF</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>' +
      (items.length ? items.map((e) => '<tr class="click" data-finrow="' + e.id + '"><td>' + dShort(e.date) + "</td><td>" + esc(e.desc) + "</td><td>" + esc(FKN[e.kind] || e.kind) + "</td><td>" + esc(e.partner || (e.clientId ? cname(e.clientId) : "")) + "</td><td>" + (e.kind === "receber" ? (e.nf ? '<span class="pill ok">emitida</span>' : '<span class="pill warn">emitir</span>') : "") + '</td><td class="num ' + (e.kind === "receber" ? "in" : "out") + '">' + (e.kind === "receber" ? "+ " : "− ") + brl(e.amount) + '</td><td><button type="button" class="pill ' + (e.status === "pago" ? "ok" : "warn") + '" data-paytoggle="' + e.id + '" style="border:0">' + (e.status === "pago" ? (e.kind === "receber" ? "recebido" : "pago") : "pendente") + "</button></td></tr>").join("") : '<tr><td colspan="7" class="empty">Nenhum lançamento neste mês.</td></tr>') +
      "</tbody></table></div></section>" +
      '<section class="panel"><div class="ph"><h2>Recorrentes</h2><button type="button" class="btn ghost" data-new="rec">Novo recorrente</button></div><ul class="list">' +
      (S.finrec.length ? S.finrec.map((r) => '<li><button type="button" class="row" data-rec="' + r.id + '"><span class="pill">dia ' + esc(r.day) + '</span><span class="t">' + esc(r.desc) + '<div class="s">' + esc(FKN[r.kind] || "") + "</div></span><span>" + brl(r.amount) + "</span></button></li>").join("") : '<li class="empty">Nenhum recorrente.</li>') +
      '</ul></section><p class="note">Só você vê esta área. Mesmo que você compartilhe a central com a equipe, os dados do financeiro ficam bloqueados para qualquer outra pessoa.</p>';
  }

  // ---------- render ----------
  function render() {
    for (const b of document.querySelectorAll("#menu button")) b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false");
    $("#nav-fin").hidden = !S.owner;
    $("#b-aprovacao").textContent = S.posts.filter((p) => p.status === "aprovacao").length || "";
    $("#b-conteudo").textContent = S.posts.filter((p) => monthOf(p.date) === thisMonth()).length || "";
    $("#b-trafego").textContent = S.traffic.filter((x) => x.status !== "feito").length || "";
    if (!db) return;
    $("#nav-matriz").hidden = !S.owner;
    $("#b-equipe").textContent = TEAM.filter((t) => t.name !== "Luiza").reduce((s, t) => s + teamCount(t), 0) || "";
    $("#b-medico").textContent = S.medicos.filter((x) => x.status !== "pausado").length || "";
    $("#b-demandas").textContent = S.demandas.filter((d) => d.status !== "feito").length || "";
    const v = { geral: vGeral, matriz: vMatriz, equipe: vEquipe, demandas: vDemandas, conteudo: vConteudo, aprovacao: vAprovacao, painel: vPainel, medico: vMedico, clientes: vClientes, trafego: vTrafego, financeiro: vFinanceiro }[S.view] || vGeral;
    const scroller = $(".kanban-wrap"); const sx = scroller ? scroller.scrollLeft : 0;
    $("#main").innerHTML = (S.err ? '<div class="status err" role="alert">' + esc(S.err) + "</div>" : "") +
      (!S.ready ? '<div class="status">Carregando seus dados…</div>' : "") + v();
    const ns = $(".kanban-wrap"); if (ns) ns.scrollLeft = sx;
  }

  function go(view) { S.view = view; S.err = ""; try { localStorage.setItem("nexo-view", view); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-demwho],[data-newdemc],[data-person],[data-dem],[data-mxedit],[data-mxdeleg],[data-mxdel],[data-medtab],[data-medrole],[data-medstatus],[data-med],[data-editmed],[data-medm],[data-medclient],[data-pcgo],[data-pc],[data-editbrand],[data-rmimg],[data-copy],[data-view],[data-go],[data-new],[data-post],[data-client],[data-traffic],[data-filter],[data-mode],[data-cal],[data-fin],[data-finrow],[data-paytoggle],[data-rec],[data-genrec],[data-newdate]");
    if (!el || el.closest("dialog")) return;
    const d = el.dataset;
    if (d.demwho) { S.demWho = d.demwho; return render(); }
    if (d.newdemc) return editDemanda(null, { clientId: d.newdemc });
    if (d.person) { S.person = d.person; try { localStorage.setItem("nexo-person", d.person); } catch (e) {} return render(); }
    if (d.dem) return editDemanda(S.demandas.find((x) => x.id === d.dem));
    if (d.new === "dem") return editDemanda();
    if (d.mxedit) return editTask(S.matriz.find((x) => x.id === d.mxedit));
    if (d.mxdeleg) return delegate(S.matriz.find((x) => x.id === d.mxdeleg));
    if (d.mxdel) {
      if (S.mxDel !== d.mxdel) { S.mxDel = d.mxdel; render(); setTimeout(() => { if (S.mxDel === d.mxdel) { S.mxDel = null; render(); } }, 3000); return; }
      S.mxDel = null; return del("matriz", d.mxdel);
    }
    if (d.medtab) { S.medTab = d.medtab; try { localStorage.setItem("nexo-medtab", d.medtab); } catch (e) {} return render(); }
    if (d.medrole) { S.medRole = d.medrole; return render(); }
    if (d.medstatus) { const m = S.medicos.find((x) => x.id === S.med); if (m) patch("medicos", m.id, Object.assign({ status: d.medstatus }, d.medstatus === "implantacao" && !m.start ? { start: today() } : {})); return; }
    if (d.med !== undefined) { S.med = d.med || null; render(); window.scrollTo(0, 0); return; }
    if (d.editmed) return editMed(S.medicos.find((x) => x.id === d.editmed));
    if (d.new === "med") return editMed();
    if (d.medm) { S.medMonth = addMonth(S.medMonth, Number(d.medm)); return render(); }
    if (d.pcgo) { S.pc = d.pcgo; return go("painel"); }
    if (d.medclient) {
      const m = S.medicos.find((x) => x.id === d.medclient);
      if (await save("clients", m.id, { name: m.name, niche: "Marketing médico" + (m.specialty ? " · " + m.specialty : ""), color: "#00a896", services: "Método iMed · " + (m.package || ""), rhythm: "", team: m.contact || "", instagram: m.instagram || "", notes: m.notes || "", order: 50 })) { S.pc = m.id; go("painel"); }
      return;
    }
    if (d.pc) { S.pc = d.pc; S.rmPending = null; return render(); }
    if (d.editbrand) return editBrand(d.editbrand);
    if (d.copy) { try { await navigator.clipboard.writeText(d.copy); el.lastChild.textContent = "copiado"; setTimeout(render, 1200); } catch (e) {} return; }
    if (d.rmimg) {
      const cid = S.pc && client(S.pc) ? S.pc : (S.filter !== "all" ? S.filter : (S.clients[0] || {}).id);
      if (S.rmPending !== d.rmimg) { S.rmPending = d.rmimg; render(); setTimeout(() => { if (S.rmPending === d.rmimg) { S.rmPending = null; render(); } }, 3000); return; }
      S.rmPending = null; const [field, idx] = d.rmimg.split(":"); return removeFile(cid, field, Number(idx));
    }
    if (d.view) return go(d.view);
    if (d.go) return go(d.go);
    if (d.newdate) return editPost(null, { date: d.newdate });
    if (d.new === "post") return editPost();
    if (d.new === "client") return editClient();
    if (d.new === "traffic") return editTraffic();
    if (d.new === "fin") return editFin();
    if (d.new === "rec") return editRec();
    if (d.post) return editPost(S.posts.find((p) => p.id === d.post));
    if (d.client) return editClient(client(d.client));
    if (d.traffic) return editTraffic(S.traffic.find((x) => x.id === d.traffic));
    if (d.filter) { S.filter = d.filter; return render(); }
    if (d.mode) { S.mode = d.mode; try { localStorage.setItem("nexo-mode", d.mode); } catch (e) {} return render(); }
    if (d.cal) { S.calMonth = addMonth(S.calMonth, Number(d.cal)); return render(); }
    if (d.fin) { S.finMonth = addMonth(S.finMonth, Number(d.fin)); return render(); }
    if (d.paytoggle) { ev.stopPropagation(); const e = S.fin.find((x) => x.id === d.paytoggle); return patch("fin", e.id, { status: e.status === "pago" ? "pendente" : "pago" }); }
    if (d.finrow) return editFin(S.fin.find((x) => x.id === d.finrow));
    if (d.rec) return editRec(S.finrec.find((x) => x.id === d.rec));
    if (d.genrec) {
      const m = S.finMonth; const [y, mo] = m.split("-").map(Number); const last = new Date(y, mo, 0).getDate();
      for (const r of S.finrec) {
        const id = r.id + "_" + m;
        if (S.fin.some((e) => e.id === id)) continue;
        await save("fin", id, { desc: r.desc, kind: r.kind, amount: r.amount, clientId: r.clientId || "", partner: r.partner || "", date: m + "-" + pad(Math.min(Number(r.day) || 1, last)), status: "pendente", nf: false, recId: r.id });
      }
    }
  });

  document.addEventListener("change", (ev) => {
    const ck = ev.target.closest && ev.target.closest("input[data-mck]");
    const pr = ev.target.closest && ev.target.closest("select[data-prio]");
    const t = ev.target;
    if (t.dataset && t.dataset.mxdone) { patch("matriz", t.dataset.mxdone, t.checked ? { done: true, doneAt: new Date().toISOString() } : { done: false, doneAt: null }); return; }
    if (t.dataset && t.dataset.mxq) { patch("matriz", t.dataset.mxq, { q: Number(t.value) }); return; }
    if (t.dataset && t.dataset.demdone) { patch("demandas", t.dataset.demdone, t.checked ? { status: "feito", doneAt: new Date().toISOString() } : { status: "afazer", doneAt: null }); return; }
    if (t.dataset && t.dataset.demst) { patch("demandas", t.dataset.demst, Object.assign({ status: t.value }, t.value === "feito" ? { doneAt: new Date().toISOString() } : {})); return; }
    const gv = ev.target.closest && ev.target.closest("select[data-grav]");
    if (gv) { patch("medicos", gv.dataset.grav, { gravacao: gv.value }); return; }
    const m = S.medicos.find((x) => x.id === ((ck && ck.dataset.mid) || S.med));
    if (m && ck) { const checks = Object.assign({}, m.checks || {}); if (ck.checked) checks[ck.dataset.mck] = true; else delete checks[ck.dataset.mck]; patch("medicos", m.id, { checks }); return; }
    if (m && pr) { patch("medicos", m.id, { prio: Object.assign({}, m.prio || {}, { [pr.dataset.prio]: pr.value }) }); return; }
    const inp = ev.target.closest && ev.target.closest("input[data-upload]");
    if (!inp || !inp.files || !inp.files.length) return;
    const cid = S.pc && client(S.pc) ? S.pc : (S.filter !== "all" ? S.filter : (S.clients[0] || {}).id);
    uploadFiles(cid, inp.dataset.upload, Array.from(inp.files));
  });

  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "mx-add") return;
    ev.preventDefault();
    const title = $("#mx-title").value.trim(); if (!title) return;
    const data = { title, q: Number($("#mx-q").value), done: false, created: new Date().toISOString() };
    if ($("#mx-due").value) data.due = $("#mx-due").value;
    if (await save("matriz", uid("m"), data)) { $("#mx-title").value = ""; $("#mx-due").value = ""; }
  });

  // arrastar cartões entre etapas
  document.addEventListener("dragstart", (ev) => { const c = ev.target.closest && ev.target.closest(".card"); if (c) ev.dataTransfer.setData("text/plain", c.dataset.post ? "post:" + c.dataset.post : "dem:" + c.dataset.dem); });
  document.addEventListener("dragover", (ev) => { const col = ev.target.closest && ev.target.closest(".col"); if (col) { ev.preventDefault(); col.classList.add("over"); } });
  document.addEventListener("dragleave", (ev) => { const col = ev.target.closest && ev.target.closest(".col"); if (col && !col.contains(ev.relatedTarget)) col.classList.remove("over"); });
  document.addEventListener("drop", (ev) => {
    const col = ev.target.closest && ev.target.closest(".col"); if (!col) return;
    ev.preventDefault(); col.classList.remove("over");
    const [kind, id] = ev.dataTransfer.getData("text/plain").split(":");
    if (kind === "post") { const p = S.posts.find((x) => x.id === id); if (p && col.dataset.col && p.status !== col.dataset.col) patch("posts", id, { status: col.dataset.col }); }
    if (kind === "dem") { const d = S.demandas.find((x) => x.id === id); const st = col.dataset.dcol; if (d && st && d.status !== st) patch("demandas", id, Object.assign({ status: st }, st === "feito" ? { doneAt: new Date().toISOString() } : {})); }
  });

  // ---------- boot ----------
  S.calMonth = thisMonth(); S.finMonth = thisMonth(); S.medMonth = thisMonth();
  try {
    const hv = (location.hash || "").slice(1);
    S.person = localStorage.getItem("nexo-person") || null;
    S.view = ["geral", "matriz", "equipe", "demandas", "conteudo", "aprovacao", "painel", "medico", "clientes", "trafego", "financeiro"].includes(hv) ? hv : (localStorage.getItem("nexo-view") || "geral");
    S.mode = localStorage.getItem("nexo-mode") || "quadro";
    S.medTab = localStorage.getItem("nexo-medtab") || "implantacao";
  } catch (e) {}
  render();
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { $("#main").innerHTML = '<h1>Nexo Digital</h1><p class="lede">Entre na sua conta do Claude para abrir a central.</p>'; return; }
    const user = await window.claude.use("user");
    try { S.owner = user ? !!(await user.isOwner()) : false; } catch (e) { S.owner = false; }
    if ((S.view === "financeiro" || S.view === "matriz") && !S.owner) S.view = "geral";
    render();
    listen("clients", "clients", (a, b) => (a.order || 99) - (b.order || 99) || (a.name < b.name ? -1 : 1));
    listen("posts", "posts", byDate);
    listen("traffic", "traffic");
    listen("demandas", "demandas");
    if (S.owner) listen("matriz", "matriz");
    listen("medicos", "medicos", (a, b) => (a.name || "") < (b.name || "") ? -1 : 1);
    listenMap("brand", "brand");
    listenMap("metrics", "metrics");
    try { assets = await window.claude.use("assets"); } catch (e) { assets = null; }
    render();
    if (S.owner) { listen("fin", "fin", byDate); listen("finrec", "finrec", (a, b) => (Number(a.day) || 0) - (Number(b.day) || 0)); }
  })();
})();
</script>
